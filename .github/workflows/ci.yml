name: CI

# Corre en cada push y PR contra main. No necesita ninguno de los secretos reales
# (Redis/Supabase/Autotask/Graph) — Redis.fromEnv() y createClient() de Supabase
# construyen el cliente de forma perezosa, así que type-check y los tests
# unitarios (funciones puras, sin llamadas de red) pasan sin credenciales.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (type-check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, no 20: @upstash/redis espera un WebSocket global nativo, que
          # Node solo trae desde la 22 — con Node 20 el import de src/lib/
          # ticket-lock.ts (y todo lo que lo importa, como notif-poll.ts)
          # tira "Node.js detected but native WebSocket not found." al vuelo.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run

  extension:
    name: Extensión (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ticket_lock_wxt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, no 20: @upstash/redis espera un WebSocket global nativo, que
          # Node solo trae desde la 22 — con Node 20 el import de src/lib/
          # ticket-lock.ts (y todo lo que lo importa, como notif-poll.ts)
          # tira "Node.js detected but native WebSocket not found." al vuelo.
          node-version: 22
          cache: npm
          cache-dependency-path: ticket_lock_wxt/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run compile
      - name: Build (Chrome/Edge/Firefox)
        run: |
          npm run build
          npm run build:edge
          npm run build:firefox
